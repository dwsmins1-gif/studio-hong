<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORKS — STUDIO HONG</title>
<meta name="theme-color" content="#EEE8DE">
<link rel="stylesheet" href="styles.css">
<style>
  .works-page { padding: calc(var(--nav-h) + clamp(48px, 7vw, 96px)) 0 clamp(80px, 10vw, 160px); }
  .wp-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; padding-bottom: 28px; border-bottom: 1px solid var(--line-strong); }
  .wp-top .sec-title { font-size: clamp(56px, 9vw, 140px); }
  .wp-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wp-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 24px 0 clamp(36px, 5vw, 64px); position: sticky; top: var(--nav-h); z-index: 5; background: linear-gradient(var(--paper) 80%, rgba(238,232,222,0)); }
  .wp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(44px, 5vw, 64px) clamp(18px, 2.4vw, 32px); }
  .wp-grid .work-title { font-size: clamp(18px, 1.5vw, 22px); }
  .wp-empty { grid-column: 1 / -1; padding: 80px 0; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); }
  @media (max-width: 1080px) { .wp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    .wp-grid { grid-template-columns: 1fr; }
    .wp-bar { margin: 0 calc(var(--pad) * -1); padding-left: var(--pad); padding-right: var(--pad); }
    .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(var(--pad) * -1); padding-right: var(--pad); }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: none; }
  }
</style>
</head>
<body>

<header class="nav scrolled">
  <div class="wrap">

        <li><a href="index.html#services">SERVICES</a></li>

      </ul>
    </nav>
    <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button>
  </div>
</header>
<div class="mobile-menu">
  <a href="works.html">WORKS <small>작품</small></a>
  <a href="index.html#about">ABOUT <small>소개</small></a>
  <a href="index.html#services">SERVICES <small>제작 분야</small></a>

<main class="works-page" data-screen-label="Works Archive">
  <div class="wrap">

        <div class="eyebrow">All Works</div>

<script src="works-data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  const { WORKS, GENRES, workCard, esc, hasGenre } = window.StudioHong;
  const valid = GENRES.map((g) => g.key);
  let current = new URLSearchParams(location.search).get('genre');
  if (!valid.includes(current)) current = 'all';

  const filters = document.getElementById('filters');
  filters.innerHTML = GENRES.map((g) => {
    const n = g.key === 'all' ? WORKS.length : WORKS.filter((w) => hasGenre(w, g.key)).length;
    return `<button class="filter" data-g="${g.key}">${esc(g.ko)} <small>${String(n).padStart(2, '0')}</small></button>`;
  }).join('');

  function render() {
    filters.querySelectorAll('.filter').forEach((b) => b.setAttribute('aria-pressed', b.dataset.g === current));
    const list = WORKS.map((w, i) => ({ w, i })).filter((x) => current === 'all' || hasGenre(x.w, current));
    document.getElementById('grid').innerHTML = list.length
      ? list.map((x) => workCard(x.w, x.i)).join('')
      : `<div class="wp-empty">이 분류의 작품은 준비 중입니다.</div>`;
    document.getElementById('count').textContent = `${String(list.length).padStart(2, '0')} / ${String(WORKS.length).padStart(2, '0')} WORKS`;
  }

  filters.addEventListener('click', (e) => {
    const b = e.target.closest('.filter'); if (!b) return;
    current = b.dataset.g;
    const url = new URL(location.href);
    current === 'all' ? url.searchParams.delete('genre') : url.searchParams.set('genre', current);
    history.replaceState(null, '', url);
    render();
  });
  render();
})();
</script>
</body>
</html>
